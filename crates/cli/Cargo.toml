[package]
name = "connector-cli"
version = "0.17.9"
edition = "2021"
description = "CLI for interacting with Tauri apps via tauri-plugin-connector"
license = "MIT"
repository = "https://github.com/dickwu/tauri-connector"
homepage = "https://github.com/dickwu/tauri-connector"
keywords = ["tauri", "cli", "connector", "automation", "webview"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "tauri-connector"
path = "src/main.rs"

[dependencies]
connector-client = { version = "0.17.9", path = "../client" }
connector-mcp-server = { version = "0.17.9", path = "../mcp-server" }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
