[package]
name = "connector-workflow-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["dev-connector"]
dev-connector = ["dep:tauri-plugin-connector", "tauri-plugin-connector/native-screenshot"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
tauri = { version = "2.12.5", features = ["custom-protocol"] }
tauri-plugin-connector = { path = "../../plugin", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
