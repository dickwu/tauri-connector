name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked -p connector-cli -p connector-mcp-server -p connector-client
      - run: cargo test --locked -p connector-cli -p connector-mcp-server -p connector-client
      - run: cargo clippy --locked -p connector-cli -p connector-mcp-server -p connector-client --all-targets -- -D warnings

  plugin-check:
    name: Plugin ${{ matrix.os }} / ${{ matrix.features || 'no features' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ['', xcap, native-screenshot, 'xcap,native-screenshot']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev clang libclang-dev
      - run: cargo check --locked -p tauri-plugin-connector --no-default-features --features "${{ matrix.features }}"
      - run: cargo test --locked -p tauri-plugin-connector --no-default-features --features "${{ matrix.features }}"
      - run: cargo clippy --locked -p tauri-plugin-connector --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings

  page-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:helpers
      - run: npm run test:browser
      - run: npm run fixture:prepare

  fixture-build:
    name: Fixture ${{ matrix.os }} / connector ${{ matrix.connector }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        connector: ['on', 'off']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/workflow-fixture -> ../../target
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run fixture:prepare
      - name: Build connector enabled fixture
        if: matrix.connector == 'on'
        run: cargo build --locked --manifest-path examples/workflow-fixture/Cargo.toml --target-dir target
      - name: Build connector disabled fixture
        if: matrix.connector == 'off'
        run: cargo build --locked --manifest-path examples/workflow-fixture/Cargo.toml --no-default-features --target-dir target
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ matrix.os }}-${{ matrix.connector }}
          path: |
            target/debug/connector-workflow-fixture
            target/debug/connector-workflow-fixture.exe
          if-no-files-found: error

  native-smoke:
    name: Native WebView ${{ matrix.os }}
    needs: fixture-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop libraries and display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 xvfb dbus-x11 xdotool
      - uses: actions/download-artifact@v4
        with:
          name: fixture-${{ matrix.os }}-off
          path: target/debug
      - name: Restore executable bit
        if: runner.os != 'Windows'
        run: chmod +x target/debug/connector-workflow-fixture
      - name: Native feature-off smoke (desktop session)
        if: runner.os != 'Linux'
        run: node examples/workflow-fixture/scripts/feature-off-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/feature-off
      - name: Native feature-off smoke (Xvfb WebKitGTK)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node examples/workflow-fixture/scripts/feature-off-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/feature-off
      - uses: actions/download-artifact@v4
        with:
          name: fixture-${{ matrix.os }}-on
          path: target/debug
      - name: Restore executable bit
        if: runner.os != 'Windows'
        run: chmod +x target/debug/connector-workflow-fixture
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build real CLI and stdio entry points for the native contract test
        run: cargo build -p connector-cli -p connector-mcp-server --locked
      - name: Native upgrade smoke (desktop session)
        if: runner.os != 'Linux'
        run: node examples/workflow-fixture/scripts/upgrade-native-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/upgrade
          CONNECTOR_NATIVE_BENCHMARK: '1'
      - name: Native upgrade smoke (Xvfb WebKitGTK)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node examples/workflow-fixture/scripts/upgrade-native-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/upgrade
          CONNECTOR_NATIVE_BENCHMARK: '1'
      - name: Native picker lifecycle stress (macOS)
        if: runner.os == 'macOS'
        run: node examples/workflow-fixture/scripts/runtime-native-smoke.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/picker-stress
          CONNECTOR_NATIVE_PICKER_CYCLES: '100'
      - name: Native picker lifecycle stress (Xvfb WebKitGTK)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node examples/workflow-fixture/scripts/runtime-native-smoke.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/picker-stress
          CONNECTOR_NATIVE_PICKER_CYCLES: '100'
      - name: Legacy workflow smoke (macOS)
        if: runner.os == 'macOS'
        run: node examples/workflow-fixture/scripts/native-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/workflow
      - name: Legacy workflow smoke (Xvfb WebKitGTK)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node examples/workflow-fixture/scripts/native-test.mjs
        env:
          CONNECTOR_FIXTURE_OUTPUT: evidence/workflow
      # Windows workflow journal deliberately remains fail-closed. The upgrade
      # harness must assert that boundary and test inspection independently.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          # Do not upload app.log, credentials, raw screenshots or store inputs.
          path: |
            evidence/**/result.json
            evidence/**/*-results.json
            evidence/**/*-benchmark.json
          if-no-files-found: warn
          retention-days: 7

  docs-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run acceptance:check
      - run: cargo test --locked -p connector-mcp-server -p connector-cli

  build:
    name: Build ${{ matrix.target }}
    needs: core-contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --locked --release -p connector-cli --target ${{ matrix.target }}
          cargo build --locked --release -p connector-mcp-server --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --locked --release -p connector-cli --target ${{ matrix.target }}
          cross build --locked --release -p connector-mcp-server --target ${{ matrix.target }}

      - name: Rename binaries
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tauri-connector${{ matrix.suffix }}" \
             "dist/tauri-connector-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/tauri-connector-mcp${{ matrix.suffix }}" \
             "dist/tauri-connector-mcp-${{ matrix.target }}${{ matrix.suffix }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  aggregate:
    if: always()
    needs: [core-contracts, plugin-check, page-runtime, fixture-build, native-smoke, docs-and-skills, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci-aggregate.mjs
        env:
          CONNECTOR_CI_NEEDS: ${{ toJSON(needs) }}
